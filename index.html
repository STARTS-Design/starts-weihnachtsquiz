  {r:2, typ:"m", f:"Welcher Sagenheld soll im Odenwald an einer Quelle ermordet worden sein?", o:["Siegfried","Hagen","Dietrich von Bern","Gunther"], info:"Grasellenbach beansprucht die Quelle für sich"},

];
// Die erste Option ist immer die richtige; angezeigt wird gemischt (fest je Frage, für alle gleich).
function gemischt(i) {
  const q = F[i]; if (q.typ !== "m") return [];
  const arr = q.o.slice(); let a = (i + 144) * 2654435761 >>> 0;
  const zufall = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let k = arr.length - 1; k > 0; k--) { const j = Math.floor(zufall() * (k + 1)); [arr[k], arr[j]] = [arr[j], arr[k]]; }
  return arr;
}
const richtig = i => F[i].typ === "m" ? F[i].o[0] : String(F[i].a);
const fmt = n => Number(n).toLocaleString("de-DE");
function zahl(t) { if (t == null) return NaN; return Number(String(t).replace(/\s/g, "").replace(/\./g, "").replace(",", ".")); }

// ---------- Punkte ----------
// Multiple Choice: 1 Punkt. Schätzfragen: nächster Tipp 3, zweitnächster 2, drittnächster 1 (Gleichstand zählt gleich).
function punkteFrage(i, antworten) {
  const q = F[i], p = {}, liste = antworten.filter(a => a.frage === i);
  if (q.typ === "m") { liste.forEach(a => { p[a.spieler_id] = a.antwort === q.o[0] ? 1 : 0; }); return p; }
  const abst = liste.map(a => ({id: a.spieler_id, d: Math.abs(zahl(a.antwort) - q.a)})).filter(x => !isNaN(x.d)).sort((x, y) => x.d - y.d);
  liste.forEach(a => p[a.spieler_id] = 0);
  abst.forEach(x => { const rang = abst.filter(y => y.d < x.d).length; p[x.id] = rang === 0 ? 3 : rang === 1 ? 2 : rang === 2 ? 1 : 0; });
  return p;
}
function rangliste(spieler, antworten, bisFrage) {
  const sum = {}; spieler.forEach(s => sum[s.id] = 0);
  for (let i = 0; i <= bisFrage; i++) { const p = punkteFrage(i, antworten); for (const id in p) if (id in sum) sum[id] += p[id]; }
  return spieler.map(s => ({...s, punkte: sum[s.id]})).sort((a, b) => b.punkte - a.punkte || a.name.localeCompare(b.name));
}
function letzteGewerteteFrage(st) {
  if (st.frage < 0) return -1;
  return ["aufgeloest", "rangliste", "ende"].includes(st.phase) ? st.frage : st.frage - 1;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function speichereMeine() { localStorage.setItem("quiz_meine", JSON.stringify(meine)); }

async function laden() {

    const [s] = await sb("quiz_status?select=frage,phase,aktualisiert&id=eq.1");

function kopfFrage(i) {
  const q = F[i], r = RUNDEN[q.r];

}

function ansichtAnmelden() {
  return `<div class="karte"><h1>Willkommen! 🎄</h1><p>Gib Deinen Namen ein, dann geht's los. Am besten Vorname, bei zwei Hannahs gern mit Initial.</p>

async function anmelden() {
  const name = document.getElementById("name").value.trim();
  if (!name) return;
  if (spieler.some(s => s.name.toLowerCase() === name.toLowerCase())) { fehlerText = "Den Namen gibt's schon. Bitte mit Initial ergänzen."; letzterSchluessel = ""; zeichnen(); return; }

function ansichtSpieler() {
  if (!ich) return ansichtAnmelden();

  const q = F[i], p = punkteFrage(i, antworten), mein = alsSpieler ? meine[i] : null;
  let h = `<div class="runde">${esc(RUNDEN[q.r].titel)}</div><h2>${esc(q.f)}</h2>`;
  if (q.voll) h += `<img class="bild" src="${q.voll}" alt="">`;
  if (q.emoji) h += `<div class="emoji">${q.emoji}</div>`;
  if (q.typ === "m") {
    h += gemischt(i).map(o => `<button class="opt ${o === q.o[0] ? "richtig" : (o === mein ? "falsch" : "")}" disabled>${esc(o)}${o === q.o[0] ? " ✔︎" : ""}</button>`).join("");
  } else {
    h += `<div class="gross">${fmt(q.a)}</div>`;
    const tipps = antworten.filter(a => a.frage === i).map(a => ({name: (spieler.find(s => s.id === a.spieler_id) || {}).name || "?", t: zahl(a.antwort), p: p[a.spieler_id] || 0}))
      .filter(x => !isNaN(x.t)).sort((a, b) => Math.abs(a.t - q.a) - Math.abs(b.t - q.a)).slice(0, 3);
    if (tipps.length) h += `<p class="hinweis">Am nächsten dran:</p><table>${tipps.map(t => `<tr><td>${esc(t.name)}</td><td>${fmt(t.t)}</td><td class="pkt">+${t.p}</td></tr>`).join("")}</table>`;
  }
  if (q.info) h += `<p class="hinweis">${esc(q.info)}</p>`;
  if (alsSpieler) {
    const pk = p[ich.id];
    if (mein == null) h += `<p><span class="badge neutral">Keine Antwort</span></p>`;
    else h += `<p>Deine Antwort: <b>${esc(q.typ === "s" ? fmt(zahl(mein)) : mein)}</b> &nbsp; <span class="badge ${pk ? "ok" : "nein"}">${pk ? "+" + pk + (pk === 1 ? " Punkt" : " Punkte") : "0 Punkte"}</span></p>`;
  }
  return h;
}

function ansichtRangliste(ende) {
  const r = rangliste(spieler, antworten, letzteGewerteteFrage(st));
  let h = `<div class="karte">`;
  if (ende) {
    h += `<h1>🏆 Endstand</h1><div class="podest">
      <div class="p2">2<small>${esc(r[1] ? r[1].name : "")}</small></div>
      <div class="p1">1<small>${esc(r[0] ? r[0].name : "")}</small></div>
      <div class="p3">3<small>${esc(r[2] ? r[2].name : "")}</small></div></div>`;
  } else h += `<h1>Zwischenstand</h1>`;
  let platz = 0, vorher = null;
  h += `<table>${r.map((s, k) => { if (s.punkte !== vorher) { platz = k + 1; vorher = s.punkte; }
    return `<tr class="${ich && s.id === ich.id ? "ich" : ""}"><td class="p">${platz}.</td><td>${esc(s.name)}</td><td class="pkt">${s.punkte}</td></tr>`; }).join("")}</table></div>`;
  return h;
}

async function antworten_(i, o) {
  if (meine[i] != null) return;
  meine[i] = o; speichereMeine(); letzterSchluessel = ""; zeichnen();
  try { await sb("quiz_antworten", {method: "POST", body: JSON.stringify({spieler_id: ich.id, frage: i, antwort: o}), headers: {Prefer: "return=minimal"}}); }
  catch (e) { if (e.status !== 409) { delete meine[i]; speichereMeine(); fehlerText = "Zu spät oder Verbindung weg. Antwort nicht gezählt."; } letzterSchluessel = ""; zeichnen(); }
}
async function tippen(i) {
  const v = zahl(document.getElementById("tipp").value);
  if (isNaN(v)) { fehlerText = "Bitte eine Zahl eingeben."; letzterSchluessel = ""; zeichnen(); return; }
  fehlerText = ""; await antworten_(i, String(v));
}

// ---------- Ansicht Moderator ----------
function ansichtAdmin() {
  if (!pin) return `<div class="karte"><h1>Moderation</h1><p>PIN eingeben:</p><input type="password" inputmode="numeric" id="pin">
     <button class="btn" onclick="pinPruefen()">Weiter</button>${fehlerText ? `<div class="fehler">${esc(fehlerText)}</div>` : ""}</div>`;
  const i = st.frage, q = F[i], letzte = F.length - 1;
  const link = location.origin + location.pathname;
  let h = `<div class="karte"><div class="runde">Moderation</div>`;
  if (st.phase === "lobby") {
    h += `<h2>Lobby</h2><p>Spieler öffnen:<br><b>${esc(link)}</b></p>
      <img class="qr" alt="QR-Code" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(link)}">`;
  } else if (q) {
    const nrInRunde = F.slice(0, i + 1).filter(x => x.r === q.r).length;
    h += `<div class="nr">${esc(RUNDEN[q.r].titel)} · Frage ${nrInRunde} · gesamt ${i + 1}/${F.length}</div>
      <h2>${esc(q.f)}</h2>${q.emoji ? `<div class="emoji" style="font-size:36px">${q.emoji}</div>` : ""}
      <p>Lösung: <b>${esc(q.typ === "s" ? fmt(q.a) : q.o[0])}</b>${q.info ? `<br><span class="hinweis">${esc(q.info)}</span>` : ""}</p>
      <p>Status: <span class="badge neutral">${{offen: "Antworten offen", zu: "Geschlossen", aufgeloest: "Aufgelöst", rangliste: "Zwischenstand", ende: "Endstand"}[st.phase]}</span></p>
      <div class="zaehler">${anzahl} / ${spieler.length} <span class="hinweis" style="font-size:15px;font-weight:400">haben geantwortet</span></div>`;
  }
  h += `<div class="admin-leiste" style="margin-top:12px">`;
  const b = (txt, fn, cls = "") => `<button class="btn ${cls}" onclick="${fn}">${txt}</button>`;
  if (st.phase === "lobby") h += b("Quiz starten ▶", "steuern(0,'offen')", "gruen") + `<div></div>`;
  if (st.phase === "offen") h += b("Antworten schließen 🔒", `steuern(${i},'zu')`) + b("Zurück", `steuern(${i},'lobby')`, "zweit");
  if (st.phase === "zu") h += b("Auflösen 💡", `steuern(${i},'aufgeloest')`, "gruen") + b("Wieder öffnen", `steuern(${i},'offen')`, "zweit");
  if (st.phase === "aufgeloest" || st.phase === "rangliste") {
    if (i < letzte) {
      const rundenende = F[i + 1].r !== q.r;
      h += b(rundenende ? "Nächste Runde ▶" : "Nächste Frage ▶", `steuern(${i + 1},'offen')`, "gruen");
    } else h += b("Endstand 🏆", `steuern(${i},'ende')`, "gruen");
    h += st.phase === "rangliste" ? b("Zur Auflösung", `steuern(${i},'aufgeloest')`, "zweit") : b("Zwischenstand", `steuern(${i},'rangliste')`, "zweit");
  }
  if (st.phase === "ende") h += b("Zurück zur letzten Frage", `steuern(${i},'aufgeloest')`, "zweit") + `<div></div>`;
  h += `</div>`;
  if (st.phase !== "lobby" && i > 0) h += `<button class="btn zweit" onclick="steuern(${i - 1},'aufgeloest')">◀ Vorherige Frage</button>`;
  if (st.phase === "aufgeloest") h += `<hr style="margin:18px 0;border:0;border-top:1px solid #eee">${ansichtAufloesung(i, false)}`;
  h += `</div>`;
  if (st.phase === "rangliste" || st.phase === "ende") h += ansichtRangliste(st.phase === "ende");
  h += `<div class="karte"><b>Spieler (${spieler.length})</b><div class="liste-spieler">${spieler.map(s => `<span>${esc(s.name)} <button onclick="entfernen('${s.id}','${esc(s.name).replace(/'/g, "")}')">×</button></span>`).join("")}</div>
     <button class="btn zweit" style="margin-top:14px" onclick="zuruecksetzen()">Quiz komplett zurücksetzen</button>
     ${fehlerText ? `<div class="fehler">${esc(fehlerText)}</div>` : ""}</div>`;
  return h;
}
async function pinPruefen() {
  const v = document.getElementById("pin").value.trim();
  try { if (await rpc("quiz_pin_ok", {p_pin: v})) { pin = v; localStorage.setItem("quiz_pin", v); fehlerText = ""; } else fehlerText = "Falsche PIN."; }
  catch (e) { fehlerText = "Verbindung hakt."; }
  letzterSchluessel = ""; laden();
}
async function steuern(frage, phase) {
  try { await rpc("quiz_steuern", {p_pin: pin, p_frage: frage, p_phase: phase}); }
  catch (e) { fehlerText = "Hat nicht geklappt: " + e.message; }
  letzterSchluessel = ""; laden();
}
async function entfernen(id, name) {
  if (!confirm(name + " aus dem Quiz entfernen?")) return;
  await rpc("quiz_spieler_entfernen", {p_pin: pin, p_id: id}); letzterSchluessel = ""; laden();
}
async function zuruecksetzen() {
  if (!confirm("Wirklich alles zurücksetzen? Alle Spieler und Antworten werden gelöscht.")) return;
  await rpc("quiz_zuruecksetzen", {p_pin: pin}); letzterSchluessel = ""; laden();
}

// ---------- Zeichnen ----------
function zeichnen() {
  if (!st) { app.innerHTML = `<div class="karte"><p>${fehlerText || "Lädt …"}</p></div>`; return; }
  document.getElementById("ich").textContent = IST_ADMIN ? "Moderation" : (ich ? ich.name : "");
  // Nicht neu zeichnen, solange sich nichts geändert hat (sonst verliert das Eingabefeld den Fokus).
  const schluessel = JSON.stringify([st.frage, st.phase, spieler.length, antworten.length, anzahl, !!ich, !!pin, fehlerText, IST_ADMIN ? spieler.map(s => s.id) : 0]);
  if (schluessel === letzterSchluessel) return;
  const aktiv = document.activeElement;
  if (aktiv && aktiv.tagName === "INPUT" && aktiv.value && letzterSchluessel.startsWith(JSON.stringify([st.frage, st.phase]).slice(0, -1))) return;
  letzterSchluessel = schluessel;
  app.innerHTML = IST_ADMIN ? ansichtAdmin() : ansichtSpieler();
}

// Schnee
(function () { const s = document.getElementById("schnee"); for (let k = 0; k < 24; k++) { const e = document.createElement("i"); e.textContent = "❄"; e.style.left = Math.random() * 100 + "%";
  e.style.fontSize = (8 + Math.random() * 12) + "px"; e.style.animationDuration = (8 + Math.random() * 10) + "s"; e.style.animationDelay = (-Math.random() * 15) + "s"; s.appendChild(e); } })();

laden();
setInterval(laden, IST_ADMIN ? 1500 : 2000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) laden(); });
</script>
